name: Build GameSpeedMod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Theos
        run: |
          brew install dpkg ldid
          sudo mkdir -p /opt/theos
          sudo git clone --depth 1 --recursive https://github.com/theos/theos.git /opt/theos
          cd /opt/theos
          sudo git pull
          sudo chown -R $(id -u):$(id -g) /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          
      - name: Build dylib
        run: |
          export THEOS=/opt/theos
          make clean
          make
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameSpeedMod-dylib
          path: .theos/obj/GameSpeedMod.dylib
          retention-days: 30
